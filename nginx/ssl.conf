# =============================================================================
# AS-Demo SSL Configuration for Production
# =============================================================================
# Hostname-split topology:
#   - apex  assistant-skills.dev / www  -> advisory site at /  (default_server)
#       /demo and /demo/  301-redirect to the demo subdomain
#   - subdomain  demo.assistant-skills.dev  -> AS-Demo landing page + backend
# Single SAN cert (live/demo.assistant-skills.dev) covers all three names.
# =============================================================================

upstream queue-manager {
    server queue-manager:3000;
}

upstream terminal {
    server queue-manager:7681;
}
# NOTE: grafana upstream (lgtm:3000) intentionally removed for minimal-live.
# lgtm is stopped in the observability profile; a dead upstream hostname makes
# `nginx -t`/reload fail with "host not found in upstream". Restore alongside lgtm.

# -----------------------------------------------------------------------------
# HTTP :80 — ACME challenges + HTTP->HTTPS redirect for ALL names
# (apex + www + subdomain — all three are required for SAN webroot renewal)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name assistant-skills.dev www.assistant-skills.dev demo.assistant-skills.dev;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container healthcheck: plain 200 on :80 with no redirect, upstream, or TLS.
    # Probed via 127.0.0.1 (busybox wget resolves "localhost" to ::1, which nginx
    # does not listen on). Kept ahead of the catch-all so it isn't 301'd to HTTPS.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Redirect all other HTTP traffic to HTTPS (preserves host)
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS apex — advisory site (default_server)
# default_server is intentional: direct-IP / unknown-Host hits land on the
# advisory site rather than erroring. Caveat: this also masks a future
# demo.* DNS regression (would silently serve advisory instead of failing).
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    server_name assistant-skills.dev www.assistant-skills.dev;

    # SAN cert covers apex + www + demo
    ssl_certificate /etc/letsencrypt/live/demo.assistant-skills.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assistant-skills.dev/privkey.pem;

    # SSL configuration - Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Advisory React site
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Legacy /demo/ path -> redirect to the native demo subdomain
    location = /demo {
        return 301 https://demo.assistant-skills.dev/;
    }
    location /demo/ {
        return 301 https://demo.assistant-skills.dev/;
    }

    # No /api proxy on the apex — the demo backend lives on the subdomain only.
}

# -----------------------------------------------------------------------------
# HTTPS subdomain — AS-Demo landing page + backend
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name demo.assistant-skills.dev;

    # SAN cert covers apex + www + demo
    ssl_certificate /etc/letsencrypt/live/demo.assistant-skills.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assistant-skills.dev/privkey.pem;

    # SSL configuration - Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AS-Demo landing page at the subdomain root
    location / {
        root /var/www/html/demo;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Queue manager API
    location /api/ {
        proxy_pass http://queue-manager;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint
    location /api/ws {
        proxy_pass http://queue-manager;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Scenario pages
    location /scenarios/ {
        proxy_pass http://queue-manager/api/scenarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Terminal (requires session)
    location /terminal {
        auth_request /api/session/validate;
        proxy_pass http://terminal/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static files from queue-manager
    location /static/ {
        proxy_pass http://queue-manager/static/;
    }

    include /etc/nginx/conf.d/locations.include;
}
